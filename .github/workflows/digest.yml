name: IEL/IIL Comparative Digest

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        working-directory: .
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python src/main.py

      - name: Commit and push updated digest
        run: |
          git config user.name "iel-digest-bot"
          git config user.email "iel-digest-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Update IEL/IIL digest $(date -u +%Y-%m-%d)"
          git push
